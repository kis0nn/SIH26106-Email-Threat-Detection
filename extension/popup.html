<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Analyze Email Threat</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9fafb;
      color: #111827;
    }
    .header {
      background-color: #2563eb;
      color: white;
      padding: 12px 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header svg { width: 20px; height: 20px; }
    .content { padding: 16px; }
    .btn {
      display: block;
      width: 100%;
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 12px;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #1d4ed8; }
    .btn:disabled { background-color: #93c5fd; cursor: not-allowed; }
    
    .result-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      display: none;
    }
    .score-high { color: #e11d48; font-weight: bold; }
    .score-medium { color: #d97706; font-weight: bold; }
    .score-low { color: #059669; font-weight: bold; }
    
    .status {
      font-size: 13px;
      color: #4b5563;
      margin-top: 8px;
      text-align: center;
    }
    
    .link-btn {
      display: block;
      width: 100%;
      background-color: white;
      color: #2563eb;
      border: 1px solid #2563eb;
      padding: 8px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
      text-decoration: none;
      box-sizing: border-box;
    }
    .link-btn:hover { background-color: #eff6ff; }
  </style>
</head>
<body>
  <div class="header">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
    </svg>
    SIH26106 Threat Scanner
  </div>
  
  <div class="content">
    <p style="font-size: 14px; margin-top: 0;">Scan the currently open Gmail email for phishing, brand impersonation, and spoofing.</p>
    
    <button id="scanBtn" class="btn">Scan Current Email</button>
    <div id="status" class="status"></div>
    
    <div id="resultCard" class="result-card">
      <h3 style="margin: 0 0 8px 0; font-size: 15px;">Analysis Complete</h3>
      <div style="font-size: 14px; margin-bottom: 4px;">Risk Level: <span id="riskLevel"></span></div>
      <div style="font-size: 14px; margin-bottom: 8px;">Fraud Score: <span id="fraudScore"></span></div>
      
      <div id="govWarning" style="display: none; background: #ffe4e6; color: #e11d48; padding: 6px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 8px;">
        ⚠️ Government Impersonation Detected!
      </div>
      
      <a id="dashboardLink" href="#" target="_blank" class="link-btn">Open Full Forensic Report</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
